x_max: 11 # Maximum x-coordinate of the area to exclude from goal sampling
y_min: 10 # Minimum y-coordinate of the area to exclude from goal sampling
y_max: 16 # Maximum y-coordinate of the area to exclude from goal sampling
x_min_val: 5 # Minimum x-coordinate of the area to exclude from goal sampling
x_max_val: 11 # Maximum x-coordinate of the area to exclude from goal sampling
y_min_val: 10 # Minimum y-coordinate of the area to exclude from goal sampling
y_max_val: 16 # Maximum y-coordinate of the area to exclude from goal sampling
steps: 8e6